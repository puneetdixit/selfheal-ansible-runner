---
- name: Restart Azure Web App
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get Web App state before restart
      ansible.builtin.command:
        cmd: >
          az webapp show
          --resource-group testing-webapp-resource-group
          --name zurich-testing
          --query state
          --output tsv
      register: state_before
      changed_when: false

    - name: Display state before restart
      ansible.builtin.debug:
        msg: "Web App state before restart: {{ state_before.stdout | trim }}"

    - name: Restart Azure Web App
      ansible.builtin.command:
        cmd: >
          az webapp restart
          --resource-group testing-webapp-resource-group
          --name zurich-testing
      register: restart_result
      changed_when: true

    - name: Wait for Web App to come back
      ansible.builtin.pause:
        seconds: 10

    - name: Get Web App state after restart
      ansible.builtin.command:
        cmd: >
          az webapp show
          --resource-group testing-webapp-resource-group
          --name zurich-testing
          --query state
          --output tsv
      register: state_after
      changed_when: false
      retries: 6
      delay: 5
      until: state_after.stdout | trim == "Running"

    - name: Verify Web App HTTP endpoint
      ansible.builtin.uri:
        url: "https://zurich-testing-bhhhgmh5fzecfcem.westus3-01.azurewebsites.net/"
        method: GET
        status_code: 200
        timeout: 10
      register: http_check
      retries: 6
      delay: 5
      until: http_check.status == 200

    - name: Restart verification
      ansible.builtin.debug:
        msg:
          - "Restart command executed: YES"
          - "Web App state before: {{ state_before.stdout | trim }}"
          - "Web App state after: {{ state_after.stdout | trim }}"
          - "HTTP status: {{ http_check.status }}"
          - "Restart verification: SUCCESS"