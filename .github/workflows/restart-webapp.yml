name: Restart Azure Web App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restart Web App using Ansible
        run: |
          ansible-playbook \
            -i localhost, \
            restart-webapp.yml

      - name: Verify Web App health
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-connrefused \
            https://zurich-testing-bhhhgmh5fzecfcem.westus3-01.azurewebsites.net/

      - name: Logout
        if: always()
        run: az logout