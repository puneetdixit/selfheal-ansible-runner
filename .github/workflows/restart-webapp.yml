name: Restart Azure Web App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure CLI
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az version

      # - name: Install Ansible
      #   run: |
      #     python3 -m pip install --user ansible
      #     echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      #     "$HOME/.local/bin/ansible-playbook" --version

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure access
        run: |
          az account show --output table
          az webapp show \
            --resource-group testing-webapp-resource-group \
            --name zurich-testing \
            --query state \
            --output tsv

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i localhost, \
            restart-webapp.yml

      - name: Logout from Azure
        if: always()
        run: az logout