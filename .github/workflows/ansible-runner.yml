name: Ansible Runner

on:
  workflow_dispatch:
    inputs:
      custom_run_id:
        description: "Custom ID to correlate API trigger"
        required: false
        default: ""
      message:
        description: "Message to print"
        required: false
        default: "Hello from GitHub Actions!"

jobs:
  print-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print the custom run ID
        run: echo "Custom Run ID: ${{ github.event.inputs.custom_run_id }}"

      - name: Print the message
        run: echo "Message: ${{ github.event.inputs.message }}"
