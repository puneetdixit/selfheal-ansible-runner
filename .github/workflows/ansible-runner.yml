name: Ansible Runner

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message to print"
        required: false
        default: "Hello from GitHub Actions!"
      custom_run_id:
        description: "Custom ID to correlate API trigger"
        required: false
        default: ""

jobs:
  print-job:
    runs-on: ubuntu-latest

    steps:
      - name: Set and Print Custom Run ID (Output) 🚀
        id: set_id # Give this step an ID to reference its output
        run: |
          CUSTOM_ID="${{ github.event.inputs.custom_run_id }}"
          echo "CUSTOM_ID_VALUE=$CUSTOM_ID" >> "$GITHUB_OUTPUT"
          echo "Custom Run ID set as output: $CUSTOM_ID"

      - name: Print the message
        run: echo "${{ github.event.inputs.message }}"
